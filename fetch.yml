name: fetch-feeds
on:
  schedule:
    # GitHub starts scheduled runs 3.5-5h late (observed 3-7 Nov 2026).
    # Primary: 01:30 SGT -> expect ~05:00-06:30 SGT, before the 07:35 briefing.
    - cron: "30 17 * * *"
    # Backup: 04:45 SGT. Harmless if the primary already ran.
    - cron: "45 20 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_feeds.py --out data --seen data/seen.json --since-hours 36
      - name: Commit results
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "feed $(date -u +%F)"
          git push
